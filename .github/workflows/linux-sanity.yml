name: Linux sanity

# Large effects only, on GitHub's shared runners, by hand. No Linux numbers are recorded for
# v2.1.0 (spec #58): this asks only whether `machine` durability is a sane default on Linux,
# and, from V1 (#96), whether `poll` loses to epoll by more than twice at 64 idle connections,
# and whether the raw write-through loop, with no engine, stalls as the durable wait does. Read
# Linux against the Windows runner beside it, ratio against ratio, since a runner's disk is not
# the reference machine's. The harness may mark a closed-loop row quotable, since closed-loop service time
# may run unpinned, but it can't tell a shared runner from the reference machine:
# docs/LATENCY.md's claims rule refuses quoting any number from this workflow.
on:
  workflow_dispatch:
    inputs:
      commands:
        description: Commands per closed-loop run
        default: "20000"
      ladder_commands:
        description: Commands per run on the durable-wait timetable
        default: "5000"

permissions:
  contents: read

jobs:
  sanity:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "Linux GCC Release",    os: ubuntu-24.04 }
          - { name: "Windows MSVC Release", os: windows-2022 }

    env:
      COMMANDS: ${{ inputs.commands || '20000' }}
      LADDER_COMMANDS: ${{ inputs.ladder_commands || '5000' }}

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v5

      - name: Install Ninja
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Configure
        run: |
          args=(-DORDER_BOOK_WARNINGS_AS_ERRORS=ON -DORDER_BOOK_BUILD_BENCHMARKS=ON)
          if [ "${{ runner.os }}" = "Linux" ]; then
            args+=(-G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=g++)
          fi
          cmake -S . -B build "${args[@]}"

      - name: Build
        run: cmake --build build --config Release --target order_book_latency_benchmarks order_book_engine --parallel

      # What the runner is, so a reader can tell its disk from the engine.
      - name: Describe the runner
        run: |
          {
            echo "runner: ${{ matrix.os }}, shared GitHub-hosted, not the reference machine"
            echo "logs under: $RUNNER_TEMP/logs"
            if [ "${{ runner.os }}" = "Linux" ]; then
              uname -sr
              lscpu | grep -E 'Model name|^CPU\(s\)'
              df -hT "$RUNNER_TEMP"
            else
              powershell -NoProfile -Command "(Get-CimInstance Win32_OperatingSystem).Caption; (Get-CimInstance Win32_Processor).Name; [Environment]::ProcessorCount; Get-Volume -DriveLetter (Get-Item '$RUNNER_TEMP').PSDrive.Name | Format-List DriveLetter,FileSystemType,Size,SizeRemaining"
            fi
          } | tee machine.txt
          mkdir -p "$RUNNER_TEMP/logs"

      # The same rows on both runners: durable wait closed-loop at each level, its timetable at
      # `machine`, the round trip through the shipped engine at each level, the raw write-through
      # loop closed-loop and beside the durable wait at 1,000 a second on extended and zero-filled
      # files, and the idle-connection echo on poll and on the platform's other socket set (epoll,
      # completion ports) at 0, 16, 64, 256, and 1,024 idle connections.
      - name: Run
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            program=./build/Release/order_book_latency_benchmarks.exe
            other=completion-port
          else
            program=./build/order_book_latency_benchmarks
            other=epoll
          fi
          row() {
            name=$1
            shift
            echo "::group::$name"
            # The echo writes no log, and refuses --log-dir.
            logs=(--log-dir "$RUNNER_TEMP/logs")
            case "$name" in idle-echo-*) logs=() ;; esac
            "$program" --workload small-book --runs 9 --warmup 1 "${logs[@]}" \
              --machine-record machine.txt --out-dir "results/$name" "$@"
            echo "::endgroup::"
          }
          row durable-wait-machine --interval durable-wait --durability machine --commands "$COMMANDS"
          row durable-wait-process --interval durable-wait --durability process --commands "$COMMANDS"
          row durable-wait-machine-response --interval durable-wait --durability machine --time response \
            --commands "$LADDER_COMMANDS"
          # The warm-up run is discarded already, and a fast closed-loop run could end inside the
          # default 2 s discard.
          row round-trip-machine --interval round-trip --durability machine --commands "$COMMANDS" --discard-seconds 0
          row round-trip-process --interval round-trip --durability process --commands "$COMMANDS" --discard-seconds 0
          row raw-write-machine --interval raw-write --durability machine --commands "$COMMANDS"
          # The durable wait and the raw loop at one fixed rate, on both kinds of file, so a stall
          # only the engine shows stands out.
          for fill in extended zero-filled; do
            for interval in durable-wait raw-write; do
              row "$interval-machine-$fill-at-1000" --interval "$interval" --durability machine --time response \
                --rate 1000 --log-files "$fill" --commands "$LADDER_COMMANDS"
            done
          done
          for sockets in poll "$other"; do
            for idle in 0 16 64 256 1024; do
              row "idle-echo-$sockets-$idle" --interval idle-echo --sockets "$sockets" --idle-connections "$idle" \
                --commands "$COMMANDS"
            done
          done

      - name: Summarize
        if: always()
        run: |
          for report in results/*/report.txt; do
            [ -f "$report" ] || continue
            {
              echo "### ${{ matrix.name }}: $(basename "$(dirname "$report")")"
              echo '```'
              cat "$report"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-sanity-${{ matrix.name }}
          path: |
            results/
            machine.txt
          if-no-files-found: ignore
