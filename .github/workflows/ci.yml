name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# A new push to a pull request cancels that pull request's run in progress. Each push run gets
# a group of its own, since a group also drops a pending run when a newer one queues, so
# every push is tested.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "Linux GCC Debug",                 os: ubuntu-24.04, cxx: g++,     config: Debug }
          - { name: "Linux GCC Release",               os: ubuntu-24.04, cxx: g++,     config: Release }
          - { name: "Linux Clang Debug",               os: ubuntu-24.04, cxx: clang++, config: Debug }
          - { name: "Linux Clang Release",             os: ubuntu-24.04, cxx: clang++, config: Release }
          - { name: "Linux GCC ASan+UBSan Debug",      os: ubuntu-24.04, cxx: g++,     config: Debug,          sanitizers: true }
          - { name: "Linux Clang ASan+UBSan Debug",    os: ubuntu-24.04, cxx: clang++, config: Debug,          sanitizers: true }
          - { name: "Linux Clang ASan+UBSan Optimized", os: ubuntu-24.04, cxx: clang++, config: RelWithDebInfo, sanitizers: true }
          - { name: "Windows MSVC Debug",              os: windows-2022, config: Debug }
          - { name: "Windows MSVC Release",            os: windows-2022, config: Release }
          # MSVC has no UBSan. Release is where allocation_failure_tests runs (it skips under
          # Debug's checked iterators).
          - { name: "Windows MSVC ASan Debug",         os: windows-2022, config: Debug,   sanitizers: true }
          - { name: "Windows MSVC ASan Release",       os: windows-2022, config: Release, sanitizers: true }
          # A race or a reordering fails here. These run only the threaded tests, which the jobs
          # above run too.
          - { name: "Linux Clang TSan Optimized",      os: ubuntu-24.04, cxx: clang++, config: RelWithDebInfo, tsan: true, threaded: true }
          - { name: "Linux GCC TSan Debug",            os: ubuntu-24.04, cxx: g++,     config: Debug,          tsan: true, threaded: true }
          - { name: "Linux Arm Clang Release",         os: ubuntu-24.04-arm, cxx: clang++, config: Release,    threaded: true }
          # The browser build (docs/internals/wasm.md), every test under node: Release with
          # invariant checks off, as shipped, and Debug with them on.
          - { name: "Emscripten Release",              os: ubuntu-24.04, config: Release, emscripten: true }
          - { name: "Emscripten ASan+UBSan Debug",     os: ubuntu-24.04, config: Debug,   emscripten: true, sanitizers: true }

    env:
      # Linux only: MSVC's ASan runtime refuses to start when asked for leak detection. Emscripten
      # takes its own defaults.
      ASAN_OPTIONS: ${{ (startsWith(matrix.os, 'ubuntu') && !matrix.emscripten) && 'detect_leaks=1:strict_string_checks=1:detect_stack_use_after_return=1' || '' }}
      UBSAN_OPTIONS: print_stacktrace=1

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v5

      - name: Install Ninja
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      # emsdk and the system libraries it builds on first use, both kept under emsdk-cache.
      - name: Cache emsdk
        if: matrix.emscripten
        uses: actions/cache@v4
        with:
          path: emsdk-cache
          key: emsdk-7.0.0-${{ matrix.name }}

      - name: Install emsdk
        if: matrix.emscripten
        uses: emscripten-core/setup-emsdk@v16
        with:
          version: 7.0.0
          actions-cache-folder: emsdk-cache

      # ThreadSanitizer needs a smaller address-space randomization than these runners default to.
      - name: Make room for ThreadSanitizer
        if: matrix.tsan
        run: sudo sysctl -w vm.mmap_rnd_bits=28

      - name: Configure
        run: |
          args=(-DORDER_BOOK_WARNINGS_AS_ERRORS=ON)
          if [ "${{ matrix.emscripten }}" != "true" ]; then
            args+=(-DORDER_BOOK_BUILD_BENCHMARKS=ON)
          fi
          if [ "${{ matrix.tsan }}" = "true" ]; then
            args+=(-DORDER_BOOK_ENABLE_TSAN=ON)
          fi
          if [ "${{ matrix.emscripten }}" = "true" ]; then
            args+=(-G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.config }})
          elif [ "${{ runner.os }}" = "Linux" ]; then
            args+=(-G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.config }} -DCMAKE_CXX_COMPILER=${{ matrix.cxx }})
          fi
          if [ "${{ matrix.sanitizers }}" = "true" ]; then
            args+=(-DORDER_BOOK_ENABLE_ASAN=ON)
            if [ "${{ runner.os }}" = "Linux" ]; then
              args+=(-DORDER_BOOK_ENABLE_UBSAN=ON)
            fi
          fi
          if [ "${{ matrix.emscripten }}" = "true" ]; then
            emcmake cmake -S . -B build "${args[@]}"
          else
            cmake -S . -B build "${args[@]}"
          fi

      # Ninja keeps going past a failed target (-k 0), so one run reports every warning.
      - name: Build
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            cmake --build build --parallel -- -k 0
          else
            cmake --build build --config ${{ matrix.config }} --parallel
          fi

      - name: Test
        run: ctest --test-dir build -C ${{ matrix.config }} --output-on-failure --parallel 4 ${{ matrix.threaded && '-L threaded' || '' }}

      # The engine client's JSDoc against its hand-written engine-client.d.ts, with a pinned
      # TypeScript fetched by npx: the repo has no package.json.
      - name: Type-check the engine client
        if: matrix.emscripten && matrix.config == 'Release'
        run: >-
          npx --yes --package typescript@6.0.3 -- tsc --noEmit --allowJs --checkJs --strict
          --target es2022 --module es2022 --moduleResolution bundler --lib es2022,dom
          src/wasm/js/engine-client.js src/wasm/js/engine-client.d.ts

      # The release asset, built and checked by the Release wasm build (wasm_zip), on every run.
      - name: Upload the order_book_wasm zip
        if: matrix.emscripten && matrix.config == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: order_book_wasm
          path: build/order_book_wasm-*.zip
          if-no-files-found: error

      - name: Run the CLI
        if: ${{ !matrix.threaded }}
        run: |
          if [ "${{ matrix.emscripten }}" = "true" ]; then
            cli=(node ./build/order_book_cli.js)
          elif [ "${{ runner.os }}" = "Windows" ]; then
            cli=(./build/${{ matrix.config }}/order_book_cli.exe)
          else
            cli=(./build/order_book_cli)
          fi
          "${cli[@]}" demo
          "${cli[@]}" replay tests/replay/valid/price_time_priority.csv --trades --book

  # A tag push makes a draft GitHub Release holding that run's zip, once every job above is green.
  # Publishing the draft is a deliberate step, by hand.
  draft-release:
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-and-test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download the order_book_wasm zip
        uses: actions/download-artifact@v4
        with:
          name: order_book_wasm
          path: zip

      # The zip is named for the CMake project version, so a tag that doesn't match it is refused.
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          zip="zip/order_book_wasm-${TAG}.zip"
          if [ ! -f "$zip" ]; then
            echo "no $zip: the tag doesn't match the project version" >&2
            ls zip >&2
            exit 1
          fi
          gh release create "$TAG" "$zip" --repo "${{ github.repository }}" --draft --verify-tag --title "$TAG" --notes "order_book $TAG. The browser build's zip, built and checked by this tag's CI run."
