<svg xmlns="http://www.w3.org/2000/svg" width="960" height="712" viewBox="0 0 960 712" role="img" aria-labelledby="title desc">
<title id="title">Architecture</title>
<desc id="desc">Library targets and their dependencies, then the structures inside OrderBook: commands within an invariant boundary, the order index, the price-level maps with FIFO lists, and the node pool.</desc>
<style>
  .bg{fill:#fcfcfb} .frame{fill:none;stroke:rgba(11,11,11,.10)}
  text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#0b0b0b}
  .mono{font-family:ui-monospace,"Cascadia Mono",Consolas,Menlo,monospace}
  .t2{fill:#52514e} .t3{fill:#898781} .on{fill:#ffffff}
  .panel{fill:#f4f3ef} .box{fill:#ffffff;stroke:#c3c2b7} .box2{fill:#fcfcfb;stroke:#c3c2b7}
  .grid{stroke:#e1e0d9;stroke-width:1} .rule{stroke:#c3c2b7;stroke-width:1}
  .bid{fill:#2a78d6} .ask{fill:#eb6834}
  .bidw{fill:rgba(42,120,214,.10);stroke:#2a78d6} .askw{fill:rgba(235,104,52,.10);stroke:#eb6834}
  .trdw{fill:rgba(27,175,122,.14);stroke:#1baf7a} .accw{fill:rgba(42,120,214,.06);stroke:#2a78d6}
  .ghost{fill:none;stroke:#b5b4ad;stroke-dasharray:4 3}
  .edge{fill:none;stroke:#898781;stroke-width:1.5} .head{fill:#898781}
  .hot{fill:none;stroke:#1baf7a;stroke-width:2} .hothead{fill:#1baf7a}
  .term{fill:#3a3a36} .termtext{fill:#ffffff}
  @media (prefers-color-scheme: dark){
    .bg{fill:#1a1a19} .frame{stroke:rgba(255,255,255,.10)}
    text{fill:#f0efec} .t2{fill:#c3c2b7} .t3{fill:#898781} .on{fill:#ffffff}
    .panel{fill:#222220} .box{fill:#262624;stroke:#4a4a44} .box2{fill:#1f1f1d;stroke:#4a4a44}
    .grid{stroke:#2c2c2a} .rule{stroke:#383835}
    .bid{fill:#3987e5} .ask{fill:#d95926}
    .bidw{fill:rgba(57,135,229,.18);stroke:#3987e5} .askw{fill:rgba(217,89,38,.18);stroke:#d95926}
    .trdw{fill:rgba(25,158,112,.22);stroke:#199e70} .accw{fill:rgba(57,135,229,.08);stroke:#3987e5}
    .ghost{stroke:#5a5a54} .edge{stroke:#8a8984} .head{fill:#8a8984}
    .hot{stroke:#199e70} .hothead{fill:#199e70} .term{fill:#dcdbd5} .termtext{fill:#0b0b0b}
  }
</style>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0 1L10 5L0 9z"/></marker>
  <marker id="hotarrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="hothead" d="M0 1L10 5L0 9z"/></marker>
</defs>
<rect class="bg" width="960" height="712" rx="12"/>
<rect class="frame" x="0.5" y="0.5" width="959" height="711" rx="12"/>
<text x="24" y="34" font-size="18" font-weight="600">Architecture</text>
<text x="24" y="56" class="t2" font-size="13">Libraries depend in one direction, so the engine knows nothing about CSV, printing, or benchmarks.</text>
<text x="24" y="74" class="t2" font-size="13">Inside the engine, each structure lets a command touch only what it changes.</text>
<text x="24" y="98" class="t3" font-size="12" font-weight="600">Targets</text>
<rect class="box" x="24" y="106" width="236" height="44" rx="8"/>
<text x="38" y="125" class="mono" font-size="12.5" font-weight="600">order_book_cli</text>
<text x="38" y="142" class="t2" font-size="12">replay &lt;file.csv&gt; · demo</text>
<rect class="box" x="24" y="158" width="236" height="44" rx="8"/>
<text x="38" y="177" class="mono" font-size="12.5" font-weight="600">order_book_benchmarks</text>
<text x="38" y="194" class="t2" font-size="12">+ order_book_benchmarking</text>
<rect class="box" x="24" y="210" width="236" height="44" rx="8"/>
<text x="38" y="229" class="mono" font-size="12.5" font-weight="600">randomized_tests</text>
<text x="38" y="246" class="t2" font-size="12">+ order_book_randomized, tests only</text>
<rect class="box" x="330" y="106" width="300" height="96" rx="8"/>
<text x="344" y="126" class="mono" font-size="12.5" font-weight="600">order_book_replay</text>
<text x="344" y="144" class="t2" font-size="12">the replay format, in its own library</text>
<rect class="box2" x="344" y="158" width="80" height="28" rx="14"/>
<text x="384" y="177" font-size="12" text-anchor="middle">parser</text>
<rect class="box2" x="440" y="158" width="80" height="28" rx="14"/>
<text x="480" y="177" font-size="12" text-anchor="middle">engine</text>
<line class="edge" x1="424" y1="172" x2="438" y2="172" marker-end="url(#arrow)"/>
<rect class="box2" x="536" y="158" width="80" height="28" rx="14"/>
<text x="576" y="177" font-size="12" text-anchor="middle">summary</text>
<line class="edge" x1="520" y1="172" x2="534" y2="172" marker-end="url(#arrow)"/>
<rect class="accw" x="706" y="106" width="230" height="148" rx="8"/>
<text x="720" y="126" class="mono" font-size="12.5" font-weight="600">order_book</text>
<text x="720" y="146" class="t2" font-size="12">the engine</text>
<text x="720" y="172" font-size="12.5">· OrderBook</text>
<text x="720" y="191" font-size="12.5">· results and lifecycle events</text>
<text x="720" y="210" font-size="12.5">· checkInvariants()</text>
<text x="720" y="229" font-size="12.5">· formatEvent (printing is the caller&#x27;s)</text>
<line class="edge" x1="260" y1="128" x2="326" y2="128" marker-end="url(#arrow)"/>
<line class="edge" x1="260" y1="180" x2="326" y2="180" marker-end="url(#arrow)"/>
<line class="edge" x1="630" y1="154" x2="702" y2="154" marker-end="url(#arrow)"/>
<line class="edge" x1="260" y1="232" x2="702" y2="232" marker-end="url(#arrow)"/>
<rect class="panel" x="24" y="286" width="912" height="404" rx="12"/>
<text x="40" y="312" font-size="15" font-weight="600">Inside OrderBook</text>
<text x="184" y="312" class="t2" font-size="12.5">Six resting orders. The green path is cancelOrder(7): one index lookup, then the stored iterator and level pointer.</text>
<rect class="accw" x="36" y="334" width="200" height="200" rx="10"/>
<text x="50" y="354" class="mono" font-size="12" font-weight="600">InvariantBoundary</text>
<rect class="box" x="48" y="366" width="176" height="46" rx="8"/>
<text x="60" y="385" class="mono" font-size="12.5" font-weight="600">submitOrder</text>
<text x="60" y="402" class="t2" font-size="12">validate · match · rest</text>
<rect class="box" x="48" y="420" width="176" height="46" rx="8"/>
<text x="60" y="439" class="mono" font-size="12.5" font-weight="600">addOrder</text>
<text x="60" y="456" class="t2" font-size="12">validate · rest, never match</text>
<rect class="box" x="48" y="474" width="176" height="46" rx="8"/>
<text x="60" y="493" class="mono" font-size="12.5" font-weight="600">cancelOrder</text>
<text x="60" y="510" class="t2" font-size="12">index lookup · erase</text>
<text x="40" y="554" class="t2" font-size="12">When a command returns or throws,</text>
<text x="40" y="571" class="t2" font-size="12">Debug builds check the whole book</text>
<text x="40" y="588" class="t2" font-size="12">and abort on any violation.</text>
<rect class="box2" x="36" y="618" width="200" height="58" rx="8"/>
<text x="48" y="638" font-size="12.5" font-weight="600">Queries</text>
<text x="48" y="656" class="t2" font-size="12">best bid/ask, snapshot, find:</text>
<text x="48" y="671" class="t2" font-size="12">they return copies</text>
<line class="edge" x1="224" y1="489" x2="262" y2="489" marker-end="url(#arrow)"/>
<text x="266" y="330" class="mono" font-size="12.5" font-weight="600">orderIndex</text>
<text x="350" y="330" class="t2" font-size="12">open addressing</text>
<rect class="box" x="266" y="344" width="210" height="24" rx="4"/>
<text x="276" y="360" class="t3" font-size="11.5">empty</text>
<rect class="box" x="266" y="370" width="210" height="24" rx="4"/>
<text x="276" y="386" class="mono" font-size="11.5">#6 → ask 104 · it · level*</text>
<rect class="box" x="266" y="396" width="210" height="24" rx="4"/>
<text x="276" y="412" class="t3" font-size="11.5">empty</text>
<rect class="box" x="266" y="422" width="210" height="24" rx="4"/>
<text x="276" y="438" class="mono" font-size="11.5">#5 → ask 103 · it · level*</text>
<rect class="box" x="266" y="448" width="210" height="24" rx="4"/>
<text x="276" y="464" class="mono" font-size="11.5">#4 → bid 101 · it · level*</text>
<rect class="trdw" x="266" y="474" width="210" height="24" rx="4"/>
<text x="276" y="490" class="mono" font-size="11.5">#7 → bid 101 · it · level*</text>
<rect class="box" x="266" y="500" width="210" height="24" rx="4"/>
<text x="276" y="516" class="t3" font-size="11.5">empty</text>
<rect class="box" x="266" y="526" width="210" height="24" rx="4"/>
<text x="276" y="542" class="mono" font-size="11.5">#2 → bid 100 · it · level*</text>
<text x="266" y="572" class="t2" font-size="12">Each slot holds the order&#x27;s price and</text>
<text x="266" y="589" class="t2" font-size="12">side, its list iterator, and a pointer</text>
<text x="266" y="606" class="t2" font-size="12">to its level: cancel reaches the order</text>
<text x="266" y="623" class="t2" font-size="12">without searching the map.</text>
<text x="520" y="330" class="mono" font-size="12.5" font-weight="600">asks</text>
<text x="562" y="330" class="t2" font-size="12">std::map, std::less: begin() is the best ask</text>
<text x="520" y="554" class="mono" font-size="12.5" font-weight="600">bids</text>
<text x="562" y="554" class="t2" font-size="12">std::map, std::greater: begin() is the best bid</text>
<rect class="box" x="520" y="344" width="80" height="34" rx="6"/>
<text x="530" y="359" class="mono" font-size="12.5" font-weight="600">104</text>
<text x="530" y="373" class="t2" font-size="11">qty 8</text>
<rect class="askw" x="614" y="344" width="76" height="34" rx="6"/>
<text x="652" y="365" class="mono" font-size="12" text-anchor="middle" font-weight="600">#6 · 8</text>
<line class="edge" x1="600" y1="361" x2="611" y2="361" marker-end="url(#arrow)"/>
<rect class="box" x="520" y="386" width="80" height="34" rx="6"/>
<text x="530" y="401" class="mono" font-size="12.5" font-weight="600">103</text>
<text x="530" y="415" class="t2" font-size="11">qty 20</text>
<rect class="askw" x="614" y="386" width="76" height="34" rx="6"/>
<text x="652" y="407" class="mono" font-size="12" text-anchor="middle" font-weight="600">#5 · 20</text>
<line class="edge" x1="600" y1="403" x2="611" y2="403" marker-end="url(#arrow)"/>
<rect class="box" x="520" y="456" width="80" height="34" rx="6"/>
<text x="530" y="471" class="mono" font-size="12.5" font-weight="600">101</text>
<text x="530" y="485" class="t2" font-size="11">qty 25</text>
<rect class="bidw" x="614" y="456" width="76" height="34" rx="6"/>
<text x="652" y="477" class="mono" font-size="12" text-anchor="middle" font-weight="600">#4 · 10</text>
<line class="edge" x1="600" y1="473" x2="611" y2="473" marker-end="url(#arrow)"/>
<rect class="bidw" x="710" y="456" width="76" height="34" rx="6"/>
<text x="748" y="477" class="mono" font-size="12" text-anchor="middle" font-weight="600">#7 · 15</text>
<line class="edge" x1="690" y1="473" x2="707" y2="473" marker-end="url(#arrow)"/>
<rect class="box" x="520" y="498" width="80" height="34" rx="6"/>
<text x="530" y="513" class="mono" font-size="12.5" font-weight="600">100</text>
<text x="530" y="527" class="t2" font-size="11">qty 40</text>
<rect class="bidw" x="614" y="498" width="76" height="34" rx="6"/>
<text x="652" y="519" class="mono" font-size="12" text-anchor="middle" font-weight="600">#2 · 40</text>
<line class="edge" x1="600" y1="515" x2="611" y2="515" marker-end="url(#arrow)"/>
<text x="710" y="512" class="t2" font-size="12">FIFO list, oldest first;</text>
<text x="710" y="527" class="t2" font-size="12">its iterators stay valid</text>
<line class="hot" x1="476" y1="490" x2="517" y2="490" marker-end="url(#hotarrow)"/>
<path class="hot" d="M476 480 C492 480 492 438 516 438 L734 438 C744 438 748 442 748 453" marker-end="url(#hotarrow)"/>
<text x="664" y="433" class="t2" font-size="11.5" text-anchor="middle">iterator</text>
<text x="498" y="508" class="t2" font-size="11.5" text-anchor="middle">level*</text>
<rect class="box" x="520" y="584" width="396" height="92" rx="8"/>
<text x="534" y="606" class="mono" font-size="12.5" font-weight="600">nodePool</text>
<text x="604" y="606" class="t2" font-size="12">every list node comes from here</text>
<rect class="askw" x="534" y="618" width="20" height="18" rx="3"/>
<rect class="bidw" x="558" y="618" width="20" height="18" rx="3"/>
<rect class="bidw" x="582" y="618" width="20" height="18" rx="3"/>
<rect class="askw" x="606" y="618" width="20" height="18" rx="3"/>
<rect class="ghost" x="630" y="618" width="20" height="18" rx="3"/>
<rect class="bidw" x="654" y="618" width="20" height="18" rx="3"/>
<rect class="ghost" x="678" y="618" width="20" height="18" rx="3"/>
<rect class="ghost" x="702" y="618" width="20" height="18" rx="3"/>
<rect class="askw" x="726" y="618" width="20" height="18" rx="3"/>
<rect class="ghost" x="750" y="618" width="20" height="18" rx="3"/>
<rect class="ghost" x="774" y="618" width="20" height="18" rx="3"/>
<rect class="ghost" x="798" y="618" width="20" height="18" rx="3"/>
<rect class="ghost" x="822" y="618" width="20" height="18" rx="3"/>
<rect class="ghost" x="846" y="618" width="20" height="18" rx="3"/>
<rect class="ghost" x="870" y="618" width="20" height="18" rx="3"/>
<text x="534" y="654" class="t2" font-size="12">Freed nodes are reused: a resting order costs no heap</text>
<text x="534" y="669" class="t2" font-size="12">allocation in the steady state. The pool keeps its peak size.</text>
</svg>
