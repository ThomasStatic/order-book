<path class="edge" d="M320 266 l8 6 l-8 6"/>
<path class="edge" d="M632 266 l8 6 l-8 6"/>
<text x="24" y="378" class="t2" font-size="12.5">Asks at 101 queue 2001, then 2002:</text>
<text x="24" y="398" class="t2" font-size="12.5">acceptance order. The book is never</text>
<text x="24" y="418" class="t2" font-size="12.5">crossed after a command: 99 &lt; 101.</text>
<circle class="trdw" cx="345" cy="374" r="9"/>
<text x="345" y="378" font-size="11" text-anchor="middle" font-weight="700">1</text>
<text x="362" y="378" font-size="12.5">10 @ 101 with 2001: best price, oldest</text>
<circle class="trdw" cx="345" cy="394" r="9"/>
<text x="345" y="398" font-size="11" text-anchor="middle" font-weight="700">2</text>
<text x="362" y="398" font-size="12.5">15 @ 101 with 2002: same price, next</text>
<circle class="trdw" cx="345" cy="414" r="9"/>
<text x="345" y="418" font-size="11" text-anchor="middle" font-weight="700">3</text>
<text x="362" y="418" font-size="12.5">20 @ 102 with 2003: 101 is empty</text>
<text x="362" y="438" class="t2" font-size="12.5">The last 5 rest as a bid at 102, its own</text>
<text x="362" y="458" class="t2" font-size="12.5">limit, not at a price it traded at.</text>
<circle class="trdw" cx="657" cy="374" r="9"/>
<text x="657" y="378" font-size="11" text-anchor="middle" font-weight="700">4</text>
<text x="674" y="378" font-size="12.5">5 @ 102 with 2005, the best bid: the</text>
<text x="674" y="398" class="t2" font-size="12.5">seller gets 102, not its limit of 99</text>
<circle class="trdw" cx="657" cy="414" r="9"/>
<text x="657" y="418" font-size="11" text-anchor="middle" font-weight="700">5</text>
<text x="674" y="418" font-size="12.5">3 @ 99 with 2004, a partial fill: 2 left,</text>
<text x="674" y="438" class="t2" font-size="12.5">still at the front of its queue</text>
<line class="rule" x1="24" y1="472" x2="936" y2="472"/>
<rect class="bidw" x="24" y="482" width="30" height="18" rx="4"/>
<text x="62" y="496" class="t2" font-size="12">bid</text>
<rect class="askw" x="98" y="482" width="30" height="18" rx="4"/>
<text x="136" y="496" class="t2" font-size="12">ask (id, quantity left)</text>
<rect class="ghost" x="298" y="482" width="30" height="18" rx="4"/>
