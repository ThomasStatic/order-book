<circle class="trdw" cx="548" cy="491" r="9"/>
<text x="548" y="495" font-size="11" text-anchor="middle" font-weight="700">1</text>
<text x="564" y="496" class="t2" font-size="12">trade, numbered in execution order (= event order)</text>
<text x="24" y="520" class="t3" font-size="12">Orders nearest the price column are oldest. The CLI prints these five trades in exactly this order (see replay-terminal.svg).</text>
</svg>
