<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
<title id="title">Matching walkthrough</title>
<desc id="desc">Three snapshots of the book replaying price_time_priority.csv, with five numbered trades.</desc>
<style>
  .bg{fill:#fcfcfb} .frame{fill:none;stroke:rgba(11,11,11,.10)}
  text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#0b0b0b}
  .mono{font-family:ui-monospace,"Cascadia Mono",Consolas,Menlo,monospace}
  .t2{fill:#52514e} .t3{fill:#898781} .on{fill:#ffffff}
  .panel{fill:#f4f3ef} .box{fill:#ffffff;stroke:#c3c2b7} .box2{fill:#fcfcfb;stroke:#c3c2b7}
  .grid{stroke:#e1e0d9;stroke-width:1} .rule{stroke:#c3c2b7;stroke-width:1}
  .bid{fill:#2a78d6} .ask{fill:#eb6834}
  .bidw{fill:rgba(42,120,214,.10);stroke:#2a78d6} .askw{fill:rgba(235,104,52,.10);stroke:#eb6834}
  .trdw{fill:rgba(27,175,122,.14);stroke:#1baf7a} .accw{fill:rgba(42,120,214,.06);stroke:#2a78d6}
  .ghost{fill:none;stroke:#b5b4ad;stroke-dasharray:4 3}
  .edge{fill:none;stroke:#898781;stroke-width:1.5} .head{fill:#898781}
  .hot{fill:none;stroke:#1baf7a;stroke-width:2} .hothead{fill:#1baf7a}
  .term{fill:#3a3a36} .termtext{fill:#ffffff}
  @media (prefers-color-scheme: dark){
    .bg{fill:#1a1a19} .frame{stroke:rgba(255,255,255,.10)}
    text{fill:#f0efec} .t2{fill:#c3c2b7} .t3{fill:#898781} .on{fill:#ffffff}
    .panel{fill:#222220} .box{fill:#262624;stroke:#4a4a44} .box2{fill:#1f1f1d;stroke:#4a4a44}
    .grid{stroke:#2c2c2a} .rule{stroke:#383835}
    .bid{fill:#3987e5} .ask{fill:#d95926}
    .bidw{fill:rgba(57,135,229,.18);stroke:#3987e5} .askw{fill:rgba(217,89,38,.18);stroke:#d95926}
    .trdw{fill:rgba(25,158,112,.22);stroke:#199e70} .accw{fill:rgba(57,135,229,.08);stroke:#3987e5}
    .ghost{stroke:#5a5a54} .edge{stroke:#8a8984} .head{fill:#8a8984}
    .hot{stroke:#199e70} .hothead{fill:#199e70} .term{fill:#dcdbd5} .termtext{fill:#0b0b0b}
  }
</style>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0 1L10 5L0 9z"/></marker>
  <marker id="hotarrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="hothead" d="M0 1L10 5L0 9z"/></marker>
</defs>
<rect class="bg" width="960" height="540" rx="12"/>
<rect class="frame" x="0.5" y="0.5" width="959" height="539" rx="12"/>
<text x="24" y="38" font-size="18" font-weight="600">Matching walkthrough: price first, then time</text>
<text x="24" y="61" class="t2" font-size="13">tests/replay/valid/price_time_priority.csv through submitOrder. Each trade executes at the resting order&#x27;s price; a remainder rests at its own limit.</text>
<text x="24" y="100" font-size="15" font-weight="600">After lines 2–5</text>
<text x="24" y="119" class="t2" font-size="13">Four orders rest. Nothing crosses.</text>
<text x="336" y="100" font-size="15" font-weight="600">After line 6</text>
<text x="336" y="119" class="t2" font-size="13">A buy sweeps two price levels.</text>
<text x="648" y="100" font-size="15" font-weight="600">After line 7</text>
<text x="648" y="119" class="t2" font-size="13">A sell takes the better bid first.</text>
<rect class="box2" x="24" y="132" width="288" height="26" rx="13"/>
<text x="168" y="149" class="t2" font-size="12" text-anchor="middle">best bid 99 &lt; best ask 101</text>
