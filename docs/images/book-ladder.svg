<svg xmlns="http://www.w3.org/2000/svg" width="960" height="512" viewBox="0 0 960 512" role="img" aria-labelledby="title desc">
<title id="title">Bid and ask ladder</title>
<desc id="desc">Depth ladder of a twelve-order book: three ask levels and three bid levels, with FIFO queues.</desc>
<style>
  .bg{fill:#fcfcfb} .frame{fill:none;stroke:rgba(11,11,11,.10)}
  text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#0b0b0b}
  .mono{font-family:ui-monospace,"Cascadia Mono",Consolas,Menlo,monospace}
  .t2{fill:#52514e} .t3{fill:#898781} .on{fill:#ffffff}
  .panel{fill:#f4f3ef} .box{fill:#ffffff;stroke:#c3c2b7} .box2{fill:#fcfcfb;stroke:#c3c2b7}
  .grid{stroke:#e1e0d9;stroke-width:1} .rule{stroke:#c3c2b7;stroke-width:1}
  .bid{fill:#2a78d6} .ask{fill:#eb6834}
  .bidw{fill:rgba(42,120,214,.10);stroke:#2a78d6} .askw{fill:rgba(235,104,52,.10);stroke:#eb6834}
  .trdw{fill:rgba(27,175,122,.14);stroke:#1baf7a} .accw{fill:rgba(42,120,214,.06);stroke:#2a78d6}
  .ghost{fill:none;stroke:#b5b4ad;stroke-dasharray:4 3}
  .edge{fill:none;stroke:#898781;stroke-width:1.5} .head{fill:#898781}
  .hot{fill:none;stroke:#1baf7a;stroke-width:2} .hothead{fill:#1baf7a}
  .term{fill:#3a3a36} .termtext{fill:#ffffff}
  @media (prefers-color-scheme: dark){
    .bg{fill:#1a1a19} .frame{stroke:rgba(255,255,255,.10)}
    text{fill:#f0efec} .t2{fill:#c3c2b7} .t3{fill:#898781} .on{fill:#ffffff}
    .panel{fill:#222220} .box{fill:#262624;stroke:#4a4a44} .box2{fill:#1f1f1d;stroke:#4a4a44}
    .grid{stroke:#2c2c2a} .rule{stroke:#383835}
    .bid{fill:#3987e5} .ask{fill:#d95926}
    .bidw{fill:rgba(57,135,229,.18);stroke:#3987e5} .askw{fill:rgba(217,89,38,.18);stroke:#d95926}
    .trdw{fill:rgba(25,158,112,.22);stroke:#199e70} .accw{fill:rgba(57,135,229,.08);stroke:#3987e5}
    .ghost{stroke:#5a5a54} .edge{stroke:#8a8984} .head{fill:#8a8984}
    .hot{stroke:#199e70} .hothead{fill:#199e70} .term{fill:#dcdbd5} .termtext{fill:#0b0b0b}
  }
</style>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0 1L10 5L0 9z"/></marker>
  <marker id="hotarrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="hothead" d="M0 1L10 5L0 9z"/></marker>
</defs>
<rect class="bg" width="960" height="512" rx="12"/>
<rect class="frame" x="0.5" y="0.5" width="959" height="511" rx="12"/>
<text x="24" y="38" font-size="18" font-weight="600">Bid and ask ladder: what the book holds</text>
<text x="24" y="61" class="t2" font-size="13">Twelve resting orders. A bar is one price level&#x27;s cached aggregate quantity; its segments are the level&#x27;s orders, oldest nearest the price.</text>
<text x="24" y="80" class="t2" font-size="13">Built by replaying twelve non-crossing submissions; order_book_cli --book prints the same levels, quantities, and counts.</text>
<text x="444" y="136" class="t3" font-size="12" text-anchor="end">← bids: std::map&lt;Price, PriceLevel, std::greater&gt;</text>
<text x="480" y="136" class="t3" font-size="12" text-anchor="middle">price</text>
<text x="516" y="136" class="t3" font-size="12">asks: std::map&lt;Price, PriceLevel, std::less&gt; →</text>
<line class="grid" x1="24" y1="150" x2="936" y2="150"/>
<text x="480" y="173" class="mono" font-size="13" text-anchor="middle" font-weight="600">104</text>
<rect class="ask" x="516" y="157" width="126" height="22" rx="3"><title>order #11: 40 at 104</title></rect>
<text x="579" y="172" class="mono on" font-size="11" text-anchor="middle" font-weight="600">#11</text>
<rect class="ask" x="644" y="157" width="78" height="22" rx="3"><title>order #17: 25 at 104</title></rect>
<text x="683" y="172" class="mono on" font-size="11" text-anchor="middle" font-weight="600">#17</text>
<rect class="ask" x="724" y="157" width="30" height="22" rx="3"><title>order #21: 10 at 104</title></rect>
<text x="739" y="172" class="mono on" font-size="11" text-anchor="middle" font-weight="600">#21</text>
<text x="764" y="172" class="t2" font-size="12">75 · 3 orders</text>
<line class="grid" x1="24" y1="186" x2="936" y2="186"/>
<text x="480" y="209" class="mono" font-size="13" text-anchor="middle" font-weight="600">103</text>
<rect class="ask" x="516" y="193" width="46" height="22" rx="3"><title>order #13: 15 at 103</title></rect>
<text x="539" y="208" class="mono on" font-size="11" text-anchor="middle" font-weight="600">#13</text>
<rect class="ask" x="564" y="193" width="94" height="22" rx="3"><title>order #19: 30 at 103</title></rect>
<text x="611" y="208" class="mono on" font-size="11" text-anchor="middle" font-weight="600">#19</text>
<text x="668" y="208" class="t2" font-size="12">45 · 2 orders</text>
<line class="grid" x1="24" y1="222" x2="936" y2="222"/>
<text x="480" y="245" class="mono" font-size="13" text-anchor="middle" font-weight="600">102</text>
<rect class="ask" x="516" y="229" width="62" height="22" rx="3"><title>order #15: 20 at 102</title></rect>
<text x="547" y="244" class="mono on" font-size="11" text-anchor="middle" font-weight="600">#15</text>
<text x="588" y="244" class="t2" font-size="12">20 · 1 order</text>
<line class="grid" x1="24" y1="258" x2="936" y2="258"/>
<text x="480" y="281" class="mono t3" font-size="13" text-anchor="middle">101</text>
<line class="grid" x1="24" y1="294" x2="936" y2="294"/>
<text x="480" y="317" class="mono" font-size="13" text-anchor="middle" font-weight="600">100</text>
<rect class="bid" x="348" y="301" width="94" height="22" rx="3"><title>order #14: 30 at 100</title></rect>
<text x="395" y="316" class="mono on" font-size="11" text-anchor="middle" font-weight="600">#14</text>
<rect class="bid" x="309.6" y="301" width="36.4" height="22" rx="3"><title>order #20: 12 at 100</title></rect>
<text x="327.8" y="316" class="mono on" font-size="11" text-anchor="middle" font-weight="600">#20</text>
<text x="301.6" y="316" class="t2" font-size="12" text-anchor="end">42 · 2 orders</text>
<line class="grid" x1="24" y1="330" x2="936" y2="330"/>
<text x="480" y="353" class="mono" font-size="13" text-anchor="middle" font-weight="600">99</text>
<rect class="bid" x="364" y="337" width="78" height="22" rx="3"><title>order #12: 25 at 99</title></rect>
<text x="403" y="352" class="mono on" font-size="11" text-anchor="middle" font-weight="600">#12</text>
<rect class="bid" x="332" y="337" width="30" height="22" rx="3"><title>order #16: 10 at 99</title></rect>
<text x="347" y="352" class="mono on" font-size="11" text-anchor="middle" font-weight="600">#16</text>
<rect class="bid" x="220" y="337" width="110" height="22" rx="3"><title>order #22: 35 at 99</title></rect>
<text x="275" y="352" class="mono on" font-size="11" text-anchor="middle" font-weight="600">#22</text>
<text x="212" y="352" class="t2" font-size="12" text-anchor="end">70 · 3 orders</text>
<line class="grid" x1="24" y1="366" x2="936" y2="366"/>
<text x="480" y="389" class="mono t3" font-size="13" text-anchor="middle">98</text>
<line class="grid" x1="24" y1="402" x2="936" y2="402"/>
<text x="480" y="425" class="mono" font-size="13" text-anchor="middle" font-weight="600">97</text>
<rect class="bid" x="284" y="409" width="158" height="22" rx="3"><title>order #18: 50 at 97</title></rect>
<text x="363" y="424" class="mono on" font-size="11" text-anchor="middle" font-weight="600">#18</text>
<text x="276" y="424" class="t2" font-size="12" text-anchor="end">50 · 1 order</text>
<line class="grid" x1="24" y1="438" x2="936" y2="438"/>
<rect class="box2" fill-opacity="0" x="452" y="151" width="56" height="286" rx="0"/>
<text x="680" y="244" font-size="12.5" font-weight="600">← best ask: asks.begin()</text>
<text x="440" y="280" font-size="12.5" text-anchor="end">Nothing rests at 101: the spread is 102 − 100 = 2 ticks</text>
<text x="520" y="280" class="t2" font-size="12.5">An incoming buy crosses at a limit of 102 or more,</text>
<text x="520" y="316" class="t2" font-size="12.5">an incoming sell at 100 or less.</text>
<text x="214" y="316" font-size="12.5" text-anchor="end" font-weight="600">best bid: bids.begin() →</text>
<text x="440" y="388" class="t2" font-size="12.5" text-anchor="end">No level at 98: a level exists only while it holds orders</text>
<text x="520" y="352" class="t2" font-size="12.5">A sell for 60 at 99 fills #14 and #20 (42 at 100),</text>
<text x="520" y="388" class="t2" font-size="12.5">then 18 of #12, the oldest at 99. #12 keeps its</text>
<text x="520" y="424" class="t2" font-size="12.5">place with 7 left; #16 and #22 wait behind it.</text>
<text x="24" y="470" class="t2" font-size="12.5">The aggregate is a std::uint64_t kept in step with every fill and cancel, so reading the ladder never walks the orders.</text>
<text x="24" y="490" class="t2" font-size="12.5">Each order&#x27;s queue position is fixed at acceptance; a partial fill keeps it, and only a cancel and resubmit sends an order to the back.</text>
</svg>
