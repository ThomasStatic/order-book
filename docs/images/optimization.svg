<text x="24.0" y="38.0" font-size="18" text-anchor="start" font-weight="600">Optimization: before and after</text>
<text x="24.0" y="61.0" class="t2" font-size="13" text-anchor="start">The baseline engine against the final code, both binaries interleaved in one session on one machine, 100,000 timed commands per run.</text>
<circle class="before" cx="30" cy="85" r="5"/>
<text x="42.0" y="89.0" font-size="13" text-anchor="start">before (baseline engine)</text>
<circle class="after" cx="222" cy="85" r="6"/>
<text x="234.0" y="89.0" font-size="13" text-anchor="start">after (final code)</text>
<text x="24.0" y="134.0" font-size="15" text-anchor="start" font-weight="600">Mean cost per command: every workload got faster</text>
<text x="24.0" y="154.0" class="t2" font-size="13" text-anchor="start">Nanoseconds per command at each binary&#x27;s median run; lower is faster. Labels are the paired median speed-up; all 12 pairs per row were faster.</text>
