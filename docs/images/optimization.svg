<title id="title">Optimization: before and after</title>
<desc id="desc">Dumbbell charts of ns per command, heap share, and allocations per command, before and after optimization.</desc>
<style>
  .bg{fill:#fcfcfb} .frame{fill:none;stroke:rgba(11,11,11,.10)}
