<text x="24.0" y="406.0" font-size="15" text-anchor="start" font-weight="600">Why: the heap left the hot path</text>
<text x="24.0" y="426.0" class="t2" font-size="13" text-anchor="start">Most of the gain came from removing per-command allocation: inline result storage, a per-book node pool, an open-addressed index.</text>
