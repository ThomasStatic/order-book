<text x="24.0" y="38.0" font-size="18" text-anchor="start" font-weight="600">Response time against offered rate, matching-heavy-request</text>
<text x="24.0" y="61.0" class="t2" font-size="13" text-anchor="start">Each interval at 10, 25, 50, 75, and 90% of the capacity it measured that session, fixed timetable, 9 runs merged. Log scale.</text>
<text x="24.0" y="80.0" class="t2" font-size="13" text-anchor="start">Pinned at high priority, one shard, one connection; durability as named; one drive. Windows 11, MSVC Release, rdtscp clock.</text>
